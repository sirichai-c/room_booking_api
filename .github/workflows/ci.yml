name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: room
          POSTGRES_PASSWORD: room
          POSTGRES_DB: room_booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U room -d room_booking"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PG_URL: postgresql+psycopg://room:room@localhost:5432/room_booking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt

      - name: Tests (SQLite)
        run: pytest -q

      - name: Tests (PostgreSQL)
        run: pytest -q
        env:
          TEST_DATABASE_URL: ${{ env.PG_URL }}

      - name: Migrations run and match models
        env:
          DATABASE_URL: ${{ env.PG_URL }}
          SECRET_KEY: ci-only-secret-key-that-is-long-enough-123456
        run: |
          alembic upgrade head
          alembic check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t room-booking-api .
