# รันระบบจริง: docker compose up -d --build
# ต้องมี .env ที่ตั้ง SECRET_KEY และ POSTGRES_PASSWORD (ดู .env.example)

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-room}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-room_booking}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-room}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-room_booking}
      # เปิด port ให้แค่เครื่องนี้ (127.0.0.1) จึงมีแค่ reverse proxy ในเครื่องที่ต่อเข้ามาได้
      # และเชื่อ header X-Forwarded-For จากมันได้
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
